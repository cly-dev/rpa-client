<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPA 工作室</title>
    <script>
      window.$RefreshReg$ = window.$RefreshReg$ || function () {}
      window.$RefreshSig$ = window.$RefreshSig$ || function () { return function (type) { return type } }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import('./main.tsx').catch((error) => {
        const root = document.getElementById('root')
        const message = error instanceof Error ? (error.stack || error.message) : String(error)
        if (root !== null) {
          root.textContent = `渲染进程未能挂载：\n${message}`
          root.style.cssText = 'padding:16px;color:#b42318;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace'
        }
      })
    </script>
  </body>
</html>
