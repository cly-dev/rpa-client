appId: com.csworkspace.rpa-studio
productName: RPA工作室
directories:
  output: release
files:
  - out/**/*
extraResources:
  - from: .bundled-browsers
    to: playwright-browsers
    filter:
      - '**/*'
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
